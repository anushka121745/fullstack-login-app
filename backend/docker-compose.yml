version: '3.8'
services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_USER=postgres
      - DB_HOST=localhost
      - DB_NAME=loginapp
      - DB_PASSWORD=123456
      - DB_PORT=5432
      - JWT_SECRET=mysecretkey123
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs